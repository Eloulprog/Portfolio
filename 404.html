<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page introuvable · Elouen Le Pendeven</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230C0C0C%22/><text x=%2250%22 y=%2272%22 font-family=%22Syne, Inter, sans-serif%22 font-size=%2268%22 font-weight=%22800%22 text-anchor=%22middle%22 fill=%22%23F2EFE9%22>E</text><circle cx=%2278%22 cy=%2226%22 r=%229%22 fill=%22%23A855F7%22/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0A2A33;
            color: #F2EDE3;
            min-height: 100vh;
            display: grid; place-items: center;
            padding: 2rem;
            text-align: center;
        }
        .wrap { max-width: 560px; }
        .big {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(6rem, 22vw, 14rem);
            line-height: 0.9; letter-spacing: -0.05em;
            color: #2DD4BF;
            margin-bottom: 1rem;
        }
        .hw {
            font-family: 'Caveat', cursive;
            font-weight: 600;
            color: #F2EDE3;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            font-weight: 700; letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }
        p {
            color: rgba(242,237,227,0.6);
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        a.btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.85rem 1.6rem;
            background: #2DD4BF; color: #0A2A33;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem; font-weight: 800;
            letter-spacing: 0.08em; text-transform: uppercase;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,212,191,0.35); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="big">404<span class="hw">?</span></div>
        <h1>Cette page s'est perdue en chemin.</h1>
        <p>Le lien est peut-être cassé, ou la page a été déplacée. Reviens à l'accueil pour redécouvrir le portfolio.</p>
        <a href="/" class="btn">← Retour à l'accueil</a>
    </div>
</body>
</html>
